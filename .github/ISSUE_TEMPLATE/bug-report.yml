name: Bug Report
description: Report a bug, typo, broken download, or build issue.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help reproduce and fix the bug.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What part of the project is affected?
      options:
        - Web UI / Reader Experience
        - Book Content (Typo, missing chapter, markdown error)
        - EPUB Download / Generation
        - Modernization Pipeline
        - Build / CI / TypeScript
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Logs
      description: What actually happened, including error logs, terminal output, or screenshots.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Operating system, browser, Node version, etc.
      placeholder: e.g. macOS Sonoma, Chrome 124, Node 22
    validations:
      required: false
